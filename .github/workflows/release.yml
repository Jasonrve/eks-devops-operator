name: Release

# Runs only when you push a version tag (git tag v0.1.0 && git push origin v0.1.0). Nothing is published otherwise.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write     # create the GitHub release
      packages: write     # push image and chart to GHCR
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@v4
      - name: Package and push chart
        run: |
          helm package deploy/helm/eks-devops-operator --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push eks-devops-operator-${{ steps.v.outputs.version }}.tgz oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "eks-devops-operator-${{ steps.v.outputs.version }}.tgz" \
            deploy/helm/eks-devops-operator/crds/identity.platform.io_podidentityaccesses.yaml \
            deploy/helm/eks-devops-operator/crds/identity.platform.io_irsaaccesses.yaml \
            deploy/helm/eks-devops-operator/crds/identity.platform.io_podidentitypolicies.yaml
