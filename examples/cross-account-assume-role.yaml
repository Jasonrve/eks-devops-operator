# Cross-account role assumption: a pod in namespace "payments" lists the buckets of account 634107240400
# by assuming temp-test-s3-bucket-list-reader there.
#
# Requirements:
#   - the platform team enables the grant in the chart (see examples/values-cross-account.yaml), so the
#     "cross-account" IdentityPolicy covers namespace payments and this role ARN
#   - the target role's trust policy trusts the operator-created role:
#       arn:aws:iam::622515864211:role/eks-devops-operator/payments-s3-list
#     with actions sts:AssumeRole and sts:TagSession (see docs/reference/identitypolicy.md)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-s3-list
  namespace: payments
---
apiVersion: identity.platform.io/v1alpha1
kind: PodIdentityAccess
metadata:
  name: payments-s3-list
  namespace: payments
spec:
  serviceAccountName: payments-s3-list
  roleName: payments-s3-list
  tags:
    App: payments
  statements:
    - sid: AssumeS3ListReader
      actions: [sts:AssumeRole, sts:TagSession]
      resources: [arn:aws:iam::634107240400:role/temp-test-s3-bucket-list-reader]
  deletionPolicy: Delete
---
# Verification pod: assumes the target role and lists its buckets. It uses the AWS CLI image; the cluster must be able to pull it
# (mirror it into your registry for airgapped clusters).
apiVersion: v1
kind: Pod
metadata:
  name: s3-list-test
  namespace: payments
spec:
  serviceAccountName: payments-s3-list
  restartPolicy: Never
  containers:
    - name: aws
      image: public.ecr.aws/aws-cli/aws-cli:latest
      command: ["sh", "-c"]
      args:
        - |
          aws sts get-caller-identity --output text
          CREDS=$(aws sts assume-role --role-arn arn:aws:iam::634107240400:role/temp-test-s3-bucket-list-reader \
            --role-session-name payments-s3-list --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" --output text) || exit 1
          set -- $CREDS; export AWS_ACCESS_KEY_ID=$1 AWS_SECRET_ACCESS_KEY=$2 AWS_SESSION_TOKEN=$3
          aws sts get-caller-identity --output text
          aws s3api list-buckets --query "Buckets[].Name" --output text
